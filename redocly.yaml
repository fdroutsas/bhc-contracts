extends:
  - recommended

apis:
  bhc@v1:
    root: openapi/openapi.yaml
    # TS client output (openapi-typescript reads this config) — generated
    # from the SAME source the bundle resolves; the freshness gate locks
    # both artifacts to one commit.
    x-openapi-ts:
      output: dist/client/schema.d.ts

rules:
  operation-operationId: error
  operation-operationId-unique: error
  no-unresolved-refs: error
  no-unused-components: warn
  operation-4xx-response: warn
  info-license: off
  security-defined: error
