products:
  get:
    operationId: admin.catalog.products.index
    tags: [admin-catalog]
    summary: List products (closed set, seeded)
    responses:
      '200':
        description: All five product families.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/AdminProduct'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

productsKey:
  get:
    operationId: admin.catalog.products.show
    tags: [admin-catalog]
    summary: Product with its plans
    parameters:
      - $ref: '#/components-id'
    responses:
      '200':
        description: The product, plans included.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/AdminProduct'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
  put:
    operationId: admin.catalog.products.update
    tags: [admin-catalog]
    summary: Update a product (name/active/provisioner — audited)
    parameters:
      - $ref: '#/components-id'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                $ref: '../components/schemas.yaml#/I18nName'
              provisioner:
                type: string
                enum: [plesk, hetzner_cloud, manual]
              active:
                type: boolean
    responses:
      '200':
        description: Updated product.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/AdminProduct'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

