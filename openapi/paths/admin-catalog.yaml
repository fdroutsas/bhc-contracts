coupons:
  get:
    operationId: admin.catalog.coupons.index
    tags: [admin-catalog]
    summary: List coupons (cursor-paginated, spec §3.3)
    parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          default: 25
    responses:
      '200':
        description: One page of coupons.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/AdminCoupon'
                links:
                  type: object
                  additionalProperties: true
                meta:
                  type: object
                  additionalProperties: true
                  properties:
                    next_cursor:
                      type: [string, 'null']
                    prev_cursor:
                      type: [string, 'null']
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
  post:
    operationId: admin.catalog.coupons.create
    tags: [admin-catalog]
    summary: Create a coupon (audited)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/AdminCouponWrite'
    responses:
      '201':
        description: Created coupon.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/AdminCoupon'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

