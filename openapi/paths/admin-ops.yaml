      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Not confirmed (CONFIRM_REQUIRED) or transition invalid (SERVICE_TRANSITION_INVALID).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'

servicesChangePlan:
  post:
    operationId: admin.services.change-plan
    tags: [admin-ops]
    summary: Schedule a plan change at renewal (owner Δ2 — never an immediate charge)
    description: >
      Rides the M3.5 engine's scheduled path only: pending_plan_change is
      recorded and the J-7/renewal guards apply it. No money moves now and
      no admin verb ever charges a saved card — exceptions are handled with
      the existing credit adjustment plus the customer's own upgrade flow.
    parameters:
      - name: service
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [plan_id]
            properties:
              plan_id:
                type: string
                format: uuid
    responses:
      '200':
        description: Change scheduled for the next renewal.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/AdminService'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Cancel scheduled, incompatible target, or state guard (SERVICE_CANCEL_SCHEDULED / PLAN_NOT_COMPATIBLE / SERVICE_NOT_ACTIVE).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

