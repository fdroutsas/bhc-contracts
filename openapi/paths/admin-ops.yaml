          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason:
                type: string
    responses:
      '200':
        description: Transition applied; consumers act via the outbox.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
