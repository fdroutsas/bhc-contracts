# M8 — Admin v1 (spec §14, non-live build). Every op: admin guard on the
# admin HOSTNAME (ADR-0004) + mandatory TOTP + permission policy; mutations
# audited. Money-moving admin verbs deliberately DO NOT exist: admin
# change-plan is schedule-at-renewal only (owner Δ2 — no admin ever charges
# a customer card without fresh customer intent), exceptions go through the
# existing credit adjustment.

dashboard:
  get:
    operationId: admin.dashboard
    tags: [admin-ops]
    summary: Ops dashboard aggregates (MRR, nodes, license cost vs MRR, failures)
    responses:
      '200':
        description: Cached (60s) aggregates for the §14 dashboard.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/AdminDashboard'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

accounts:
  get:
    operationId: admin.accounts.index
    tags: [admin-ops]
    summary: Search accounts (name, VAT, owner email — cursor-paginated)
    parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: fraud_status
        in: query
        required: false
        schema:
          type: string
          enum: [clear, review, blocked]
      - name: cursor
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: One page of accounts.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/AdminAccount'
                links:
                  type: object
                  additionalProperties: true
                meta:
                  type: object
                  additionalProperties: true
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

accountsKey:
  get:
    operationId: admin.accounts.show
    tags: [admin-ops]
    summary: Account detail (profile, services, invoices, credit)
    parameters:
      - name: account
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Full ops view of one account.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [account]
                  properties:
                    account:
                      $ref: '../components/schemas.yaml#/AdminAccount'
                    services:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/AdminService'
                    invoices:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/AdminInvoice'
                    credit:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/CreditEntry'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

accountsImpersonate:
  post:
    operationId: admin.accounts.impersonate
    tags: [admin-ops]
    summary: Issue a one-time login-as-customer grant (banner + full audit)
    description: >
      Returns a short-TTL one-time token the portal exchanges via POST
      /auth/impersonate on the api host — hosts never share cookies
      (ADR-0004). The resulting portal session is flagged: every audit row
      carries the acting admin, /auth/me exposes impersonated_by for the
      banner, and three paths are excluded outright (owner Δ3): payment
      execution, account deletion, and customer credential/identity changes
      (email, password, TOTP) — each answers 403 and is audited.
    parameters:
      - name: account
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '201':
        description: Grant issued (audited as service-handling access).
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/ImpersonationGrant'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

