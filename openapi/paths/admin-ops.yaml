servicesTerminate:
  post:
    operationId: admin.services.terminate
    tags: [admin-ops]
    summary: Terminate a service via the state machine (irreversible, confirm + audited)
    parameters:
      - name: service
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason, confirm]
            properties:
              reason:
                type: string
              confirm:
                type: boolean
                description: Must be true — terminate deletes data downstream.
    responses:
      '200':
        description: Transition applied; the node leg runs final backup before removal.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/AdminService'
      '401':
