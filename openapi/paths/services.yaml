# M3 — customer services read surface + SSO issuance (owner-scoped: read +
# SSO only; every other lifecycle action is admin- or system-driven in v1).

services:
  get:
    operationId: services.index
    tags: [services]
    summary: List the services of an account (member-gated)
    parameters:
      - name: account_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          default: 25
    responses:
      '200':
        description: One page of services.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/Service'
                links:
                  type: object
                  additionalProperties: true
                meta:
                  type: object
                  additionalProperties: true
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

servicesKey:
  get:
    operationId: services.show
    tags: [services]
    summary: Service detail with the provisioning timeline
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: The service (timeline mirrors the account channel events).
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/Service'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

servicesSso:
  post:
    operationId: services.sso
    tags: [services]
    summary: Issue a one-time SSO link (short TTL, audited) — target per product capability
    description: >
      §5 ssoUrl targets per product capability (M7): `panel` for
      plesk-provisioned services, `wp_admin` for wp/woo (WP Toolkit
      one-time login), `console` for VPS. An unsupported target answers
      409 ACTION_NOT_SUPPORTED. Each issuance is audit-logged.
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [target]
            properties:
              target:
                type: string
                enum: [panel, wp_admin, console]
    responses:
      '200':
        description: Short-lived signed URL.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/SsoLink'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Service is not in a state that can be entered (SERVICE_NOT_ACTIVE).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

servicesUsage:
  get:
    operationId: services.usage
    tags: [services]
    summary: Usage snapshots for the detail-page bars (disk/traffic/mailboxes)
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 90
          default: 30
    responses:
      '200':
        description: Chronological usage points (may be empty for fresh services).
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/UsagePoint'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

servicesCancel:
  post:
    operationId: services.cancel
    tags: [services]
    summary: Schedule cancellation at period end (graceful, reversible)
    description: >
      Sets cancel_at_period_end — the J-7 renewal is NOT issued and the
      service terminates gracefully at next_due. Mutually exclusive with a
      pending plan change: scheduling a cancel CLEARS any pending change
      (typed event); while a cancel is scheduled, change-plan and addon
      purchases answer 409 SERVICE_CANCEL_SCHEDULED until uncancel.
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: The service, cancellation scheduled.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/Service'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Not active (SERVICE_NOT_ACTIVE), already scheduled (SERVICE_CANCEL_SCHEDULED), or the renewal invoice is already issued (SERVICE_CANCEL_LOCKED — support handles the cycle, no surgery on issued documents).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'

servicesUncancel:
  post:
    operationId: services.uncancel
    tags: [services]
    summary: Withdraw a scheduled cancellation
    description: >
      Clears cancel_at_period_end while the service is still active; the
      next dunning tick resumes normal renewal issuance.
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: The service, back on the renewal track.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/Service'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Not active (SERVICE_NOT_ACTIVE) or nothing scheduled (NO_CANCEL_SCHEDULED).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'

servicesUptime:
  get:
    operationId: services.uptime
    tags: [services]
    summary: 90-day daily uptime bar data for the service monitor
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Daily rollup points, oldest first (may be empty pre-monitoring).
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/UptimePoint'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

servicesResponseTimes:
  get:
    operationId: services.responseTimes
    tags: [services]
    summary: 24-hour hourly response-time chart data (avg + p95)
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Hourly rollup points, oldest first.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/ResponseTimePoint'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

servicesPower:
  post:
    operationId: services.power
    tags: [services]
    summary: VPS power action (on / off / reboot) — capability-gated
    description: >
      VPS only (409 ACTION_NOT_SUPPORTED otherwise); active services only —
      suspension is power-off WITH an action lock (§12). Rider B (M7):
      `off` pauses the service monitor (typed monitor.paused, reason
      customer_power_off) so self-inflicted downtime never alarms; `on`
      resumes monitoring with reset anti-flap counters; `reboot` touches
      nothing — the anti-flap window absorbs it.
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [action]
            properties:
              action:
                type: string
                enum: [on, off, reboot]
    responses:
      '200':
        description: Action dispatched to the node.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [action, dispatched]
                  properties:
                    action:
                      type: string
                    dispatched:
                      type: boolean
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Not active/locked (SERVICE_NOT_ACTIVE) or not a VPS (ACTION_NOT_SUPPORTED).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

servicesRebuild:
  post:
    operationId: services.rebuild
    tags: [services]
    summary: Rebuild the VPS from its base image — destructive, capability-gated
    description: >
      VPS only. Destroys the disk contents and re-runs cloud-init;
      requires explicit confirm. External refs stay (same server id).
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [confirm]
            properties:
              confirm:
                type: boolean
    responses:
      '200':
        description: Rebuild dispatched.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [dispatched]
                  properties:
                    dispatched:
                      type: boolean
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Not active (SERVICE_NOT_ACTIVE), not a VPS (ACTION_NOT_SUPPORTED) or missing confirm (CONFIRM_REQUIRED).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

servicesMetrics:
  get:
    operationId: services.metrics
    tags: [services]
    summary: VPS CPU/network metrics proxy (cached) — capability-gated
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Recent metric points (may be empty; served from cache).
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/VpsMetricPoint'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Not a VPS (ACTION_NOT_SUPPORTED).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'

servicesWordpress:
  get:
    operationId: services.wordpress
    tags: [services]
    summary: WP card data (honest-null — unverified fields are null)
    description: >
      wp/woo only (409 ACTION_NOT_SUPPORTED otherwise). Fields the real
      WP Toolkit surface has not yet been verified to provide are null by
      design (LD-8) — the SPA renders nulls gracefully from day one.
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: The WP install picture, honest-null.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/WordpressCard'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Not a WP/Woo service (ACTION_NOT_SUPPORTED).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'
