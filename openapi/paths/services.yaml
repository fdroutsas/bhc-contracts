# M3 — customer services read surface + SSO issuance (owner-scoped: read +
# SSO only; every other lifecycle action is admin- or system-driven in v1).

services:
  get:
    operationId: services.index
    tags: [services]
    summary: List the services of an account (member-gated)
    parameters:
      - name: account_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          default: 25
    responses:
      '200':
        description: One page of services.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/Service'
                links:
                  type: object
                  additionalProperties: true
                meta:
                  type: object
                  additionalProperties: true
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

servicesKey:
  get:
    operationId: services.show
    tags: [services]
    summary: Service detail with the provisioning timeline
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: The service (timeline mirrors the account channel events).
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/Service'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

servicesSso:
  post:
    operationId: services.sso
    tags: [services]
    summary: Issue a one-time control-panel SSO link (short TTL, audited)
    description: >
      Target `panel` only in v1 (spec §5 ssoUrl); `wp_admin` and `console`
      arrive with M7. Each issuance is audit-logged against the actor.
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [target]
            properties:
              target:
                type: string
                enum: [panel]
    responses:
      '200':
        description: Short-lived signed URL.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/SsoLink'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Service is not in a state that can be entered (SERVICE_NOT_ACTIVE).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

servicesUsage:
  get:
    operationId: services.usage
    tags: [services]
    summary: Usage snapshots for the detail-page bars (disk/traffic/mailboxes)
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 90
          default: 30
    responses:
      '200':
        description: Chronological usage points (may be empty for fresh services).
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/UsagePoint'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

servicesCancel:
  post:
    operationId: services.cancel
    tags: [services]
    summary: Schedule cancellation at period end (graceful, reversible)
    description: >
      Sets cancel_at_period_end — the J-7 renewal is NOT issued and the
      service terminates gracefully at next_due. Mutually exclusive with a
      pending plan change: scheduling a cancel CLEARS any pending change
      (typed event); while a cancel is scheduled, change-plan and addon
      purchases answer 409 SERVICE_CANCEL_SCHEDULED until uncancel.
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: The service, cancellation scheduled.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/Service'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Not active (SERVICE_NOT_ACTIVE) or already scheduled (SERVICE_CANCEL_SCHEDULED).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'

servicesUncancel:
  post:
    operationId: services.uncancel
    tags: [services]
    summary: Withdraw a scheduled cancellation
    description: >
      Clears cancel_at_period_end while the service is still active; the
      next dunning tick resumes normal renewal issuance.
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: The service, back on the renewal track.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/Service'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: Not active (SERVICE_NOT_ACTIVE) or nothing scheduled (NO_CANCEL_SCHEDULED).
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yaml#/Problem'
