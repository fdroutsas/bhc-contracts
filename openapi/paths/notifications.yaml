# M5-B — notification center (consumer of the typed outbox events, golden
# rule 12) + preferences. v1 channels: in-app always on, email toggleable
# per category, marketing consent explicit and default OFF — critical
# transactional notifications are NEVER gated by it.

notifications:
  get:
    operationId: notifications.index
    tags: [notifications]
    summary: List the account's in-app notifications (newest first)
    parameters:
      - name: account_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: unread
        in: query
        required: false
        schema:
          type: boolean
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          default: 25
    responses:
      '200':
        description: One page of notifications plus the unread counter.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/Notification'
                links:
                  type: object
                  additionalProperties: true
                meta:
                  type: object
                  additionalProperties: true
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

notificationsRead:
  post:
    operationId: notifications.read
    tags: [notifications]
    summary: Mark one notification as read
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: The notification, now read.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/Notification'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

notificationsReadAll:
  post:
    operationId: notifications.readAll
    tags: [notifications]
    summary: Mark every unread notification of the account as read
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [account_id]
            properties:
              account_id:
                type: string
                format: uuid
    responses:
      '200':
        description: How many were marked.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [marked]
                  properties:
                    marked:
                      type: integer
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

notificationPreferences:
  get:
    operationId: notificationPreferences.show
    tags: [notifications]
    summary: The caller's per-category channel toggles
    responses:
      '200':
        description: The preference matrix (defaults if never saved).
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/NotificationPreferences'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
  put:
    operationId: notificationPreferences.update
    tags: [notifications]
    summary: Update the caller's channel toggles (marketing = explicit consent)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/NotificationPreferences'
    responses:
      '200':
        description: The saved matrix.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas.yaml#/NotificationPreferences'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
