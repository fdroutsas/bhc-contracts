I18nName:
  type: object
  description: Per-locale strings (spec §18).
  required: [el, en]
  properties:
    el:
      type: string
    en:
      type: string

PriceWrite:
  type: object
  required: [cycle, price_cents]
  properties:
    cycle:
      type: string
      enum: [monthly, annually]
    price_cents:
      type: integer
      minimum: 0
    setup_cents:
      type: integer
      minimum: 0
      default: 0
    compare_at_cents:
      type: [integer, 'null']
      minimum: 0

AdminProduct:
  type: object
  required: [id, key, name, provisioner, active]
  properties:
    id:
      type: string
      format: uuid
    key:
      type: string
      enum: [shared, wp, woo, vps, erp]
    name:
      $ref: '#/I18nName'
    provisioner:
      type: string
      enum: [plesk, hetzner_cloud, manual]
    active:
      type: boolean
    plans:
      type: array
      items:
        $ref: '#/AdminPlan'

AdminPlan:
  type: object
  required: [id, product_id, key, name, sort, config, active, prices]
  properties:
    id:
      type: string
      format: uuid
    product_id:
      type: string
      format: uuid
    key:
      type: string
    name:
      $ref: '#/I18nName'
    sort:
      type: integer
    config:
      type: object
      additionalProperties: true
    active:
      type: boolean
    prices:
      type: array
      items:
        type: object
        required: [cycle, price_cents, setup_cents]
        properties:
          cycle:
            type: string
            enum: [monthly, annually]
          price_cents:
            type: integer
          setup_cents:
            type: integer
          compare_at_cents:
            type: [integer, 'null']

AdminPlanWrite:
  type: object
  required: [product_id, key, name, prices]
  properties:
    product_id:
      type: string
      format: uuid
    key:
      type: string
    name:
      $ref: '#/I18nName'
    sort:
      type: integer
      default: 0
    config:
      type: object
      additionalProperties: true
    active:
      type: boolean
      default: true
    prices:
      type: array
      minItems: 1
      items:
        $ref: '#/PriceWrite'

AdminAddon:
  type: object
  required: [id, key, name, config, compatible_products, prices]
  properties:
    id:
      type: string
      format: uuid
    key:
      type: string
    name:
      $ref: '#/I18nName'
    config:
      type: object
      additionalProperties: true
    compatible_products:
      type: array
      items:
        type: string
        enum: [shared, wp, woo, vps, erp]
    prices:
      type: array
      items:
        type: object
        required: [cycle, price_cents]
        properties:
          cycle:
            type: string
            enum: [monthly, annually]
          price_cents:
            type: integer

AdminAddonWrite:
  type: object
  required: [key, name, prices]
  properties:
    key:
      type: string
    name:
      $ref: '#/I18nName'
    config:
      type: object
      additionalProperties: true
    compatible_products:
      type: array
      items:
        type: string
        enum: [shared, wp, woo, vps, erp]
    prices:
      type: array
      minItems: 1
      items:
        type: object
        required: [cycle, price_cents]
        properties:
          cycle:
            type: string
            enum: [monthly, annually]
          price_cents:
            type: integer
            minimum: 0

AdminCoupon:
  type: object
  required: [id, code, type, value, active]
  properties:
    id:
      type: string
      format: uuid
    code:
      type: string
    type:
      type: string
      enum: [percent, fixed]
    value:
      type: integer
      description: Percent 1–100, or cents for fixed.
    applies_to:
      type: object
      additionalProperties: true
    max_redemptions:
      type: [integer, 'null']
    per_account_limit:
      type: [integer, 'null']
    valid_from:
      type: [string, 'null']
      format: date-time
    valid_until:
      type: [string, 'null']
      format: date-time
    active:
      type: boolean
    created_at:
      type: string
      format: date-time

AdminCouponWrite:
  type: object
  required: [code, type, value]
  properties:
    code:
      type: string
      maxLength: 40
    type:
      type: string
      enum: [percent, fixed]
    value:
      type: integer
      minimum: 1
    applies_to:
      type: object
      additionalProperties: true
    max_redemptions:
      type: [integer, 'null']
      minimum: 1
    per_account_limit:
      type: [integer, 'null']
      minimum: 1
    valid_from:
      type: [string, 'null']
      format: date-time
    valid_until:
      type: [string, 'null']
      format: date-time
    active:
      type: boolean
      default: true

Problem:
  type: object
  description: RFC 9457 problem details with a stable machine-readable `code`.
  required: [type, title, status, code, instance]
  properties:
    type:
      type: string
      format: uri
      examples: ['https://api.bithosting.cloud/problems/not-found']
    title:
      type: string
      description: Localized (el default, en via Accept-Language).
    status:
      type: integer
    code:
      type: string
      description: Stable UPPER_SNAKE error code.
      examples: [NOT_FOUND]
    instance:
      type: string
    detail:
      type: string
  additionalProperties: true

ValidationProblem:
  allOf:
    - $ref: '#/Problem'
    - type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

User:
  type: object
  required: [id, name, email, locale, totp_enabled]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    email:
      type: string
      format: email
    locale:
      type: string
      enum: [el, en]
    totp_enabled:
      type: boolean
    last_login_at:
      type: [string, 'null']
      format: date-time
    created_at:
      type: string
      format: date-time

Money:
  type: object
  description: Spec §3.3 — integer minor units, EUR only in v1.
  required: [amount, currency]
  properties:
    amount:
      type: integer
      description: Cents.
    currency:
      type: string
      const: EUR

Account:
  type: object
  required: [id, name, type, balance]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    type:
      type: string
      enum: [individual, company]
    address_line1:
      type: [string, 'null']
    address_line2:
      type: [string, 'null']
    city:
      type: [string, 'null']
    postal_code:
      type: [string, 'null']
    country:
      type: [string, 'null']
      description: ISO 3166-1 alpha-2.
    vat_number:
      type: [string, 'null']
    vies_valid:
      type: [boolean, 'null']
    vies_checked_at:
      type: [string, 'null']
      format: date-time
    tax_treatment:
      type: [string, 'null']
      enum: [gr_standard, eu_reverse, non_eu, null]
    balance:
      $ref: '#/Money'
    created_at:
      type: string
      format: date-time

AccountMember:
  type: object
  required: [id, role, user]
  properties:
    id:
      type: string
      format: uuid
    role:
      type: string
      enum: [owner, admin, billing, tech]
    accepted_at:
      type: [string, 'null']
      format: date-time
    user:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email

AccountInvite:
  type: object
  required: [id, role, email]
  properties:
    id:
      type: string
      format: uuid
    role:
      type: string
      enum: [admin, billing, tech]
    email:
      type: string
      format: email
    invited_by:
      type: [string, 'null']
      format: uuid
    created_at:
      type: string
      format: date-time

AdminUser:
  type: object
  required: [id, name, email, totp_enabled]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    email:
      type: string
      format: email
    role:
      type: [string, 'null']
      description: Role key (e.g. super_admin).
    totp_enabled:
      type: boolean
    last_login_at:
      type: [string, 'null']
      format: date-time
    created_at:
      type: string
      format: date-time

TotpSetup:
  type: object
  required: [secret, otpauth_uri]
  properties:
    secret:
      type: string
      description: Base32 TOTP secret (shown once; SPA renders the QR).
    otpauth_uri:
      type: string
      format: uri

LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
    remember:
      type: boolean
      description: Ignored on the admin surface (admins get no remember-me).

TotpCodeRequest:
  type: object
  required: [code]
  properties:
    code:
      type: string
      minLength: 6
      maxLength: 21
      description: >
        6-digit TOTP code — or, on the login challenge, a one-time recovery
        code (v1.3). Recovery codes are consumed on use.

RecoveryCodes:
  type: object
  required: [recovery_codes]
  properties:
    recovery_codes:
      type: array
      minItems: 8
      maxItems: 8
      description: One-time codes, shown exactly once — store them safely.
      items:
        type: string
