I18nName:
  type: object
  description: Per-locale strings (spec §18).
  required: [el, en]
  properties:
    el:
      type: string
    en:
      type: string

PriceWrite:
  type: object
  required: [cycle, price_cents]
  properties:
    cycle:
      type: string
      enum: [monthly, annually]
    price_cents:
      type: integer
      minimum: 0
    setup_cents:
      type: integer
      minimum: 0
      default: 0
    compare_at_cents:
      type: [integer, 'null']
      minimum: 0

AdminProduct:
  type: object
  required: [id, key, name, provisioner, active]
  properties:
    id:
      type: string
      format: uuid
    key:
      type: string
      enum: [shared, wp, woo, vps, erp]
    name:
      $ref: '#/I18nName'
    provisioner:
      type: string
      enum: [plesk, hetzner_cloud, manual]
    active:
      type: boolean
    plans:
      type: array
      items:
        $ref: '#/AdminPlan'

AdminPlan:
  type: object
  required: [id, product_id, key, name, sort, config, active, prices]
  properties:
    id:
      type: string
      format: uuid
    product_id:
      type: string
      format: uuid
    key:
      type: string
    name:
      $ref: '#/I18nName'
    sort:
      type: integer
    config:
      type: object
      additionalProperties: true
    active:
      type: boolean
    prices:
      type: array
      items:
        type: object
        required: [cycle, price_cents, setup_cents]
        properties:
          cycle:
            type: string
            enum: [monthly, annually]
          price_cents:
            type: integer
          setup_cents:
            type: integer
          compare_at_cents:
            type: [integer, 'null']

AdminPlanWrite:
  type: object
  required: [product_id, key, name, prices]
  properties:
    product_id:
      type: string
      format: uuid
    key:
      type: string
    name:
      $ref: '#/I18nName'
    sort:
      type: integer
      default: 0
    config:
      type: object
      additionalProperties: true
    active:
      type: boolean
      default: true
    prices:
      type: array
      minItems: 1
      items:
        $ref: '#/PriceWrite'

AdminAddon:
  type: object
  required: [id, key, name, config, compatible_products, prices]
  properties:
    id:
      type: string
      format: uuid
    key:
      type: string
    name:
      $ref: '#/I18nName'
    config:
      type: object
      additionalProperties: true
    compatible_products:
      type: array
      items:
        type: string
        enum: [shared, wp, woo, vps, erp]
    prices:
      type: array
      items:
        type: object
        required: [cycle, price_cents]
        properties:
          cycle:
            type: string
            enum: [monthly, annually]
          price_cents:
            type: integer

AdminAddonWrite:
  type: object
  required: [key, name, prices]
  properties:
    key:
      type: string
    name:
      $ref: '#/I18nName'
    config:
      type: object
      additionalProperties: true
    compatible_products:
      type: array
      items:
        type: string
        enum: [shared, wp, woo, vps, erp]
    prices:
      type: array
      minItems: 1
      items:
        type: object
        required: [cycle, price_cents]
        properties:
          cycle:
            type: string
            enum: [monthly, annually]
          price_cents:
            type: integer
            minimum: 0

AdminCoupon:
  type: object
  required: [id, code, type, value, active]
  properties:
    id:
      type: string
      format: uuid
    code:
      type: string
    type:
      type: string
      enum: [percent, fixed]
    value:
      type: integer
      description: Percent 1–100, or cents for fixed.
    applies_to:
      type: object
      additionalProperties: true
    max_redemptions:
      type: [integer, 'null']
    per_account_limit:
      type: [integer, 'null']
    valid_from:
      type: [string, 'null']
      format: date-time
    valid_until:
      type: [string, 'null']
      format: date-time
    active:
      type: boolean
    created_at:
      type: string
      format: date-time

AdminCouponWrite:
  type: object
  required: [code, type, value]
  properties:
    code:
      type: string
      maxLength: 40
    type:
      type: string
      enum: [percent, fixed]
    value:
      type: integer
      minimum: 1
    applies_to:
      type: object
      additionalProperties: true
    max_redemptions:
      type: [integer, 'null']
      minimum: 1
    per_account_limit:
      type: [integer, 'null']
      minimum: 1
    valid_from:
      type: [string, 'null']
      format: date-time
    valid_until:
      type: [string, 'null']
      format: date-time
    active:
      type: boolean
      default: true

DocumentRef:
  type: object
  description: Lightweight reference to a billing document (proforma/invoice).
  required: [id, series, number, display_number, type, status, totals]
  properties:
    id:
      type: string
      format: uuid
    series:
      type: string
    number:
      type: integer
    display_number:
      type: string
      examples: [PF-000001]
    type:
      type: string
      enum: [invoice, proforma]
    status:
      type: string
      enum: [draft, issued, paid, overdue, void]
    issue_date:
      type: [string, 'null']
      format: date
    due_date:
      type: [string, 'null']
      format: date
    mydata_mark:
      type: [string, 'null']
    pdf_available:
      type: boolean
    totals:
      $ref: '#/Totals'

Totals:
  type: object
  required: [net, vat, gross]
  properties:
    net:
      $ref: '#/Money'
    vat:
      $ref: '#/Money'
    gross:
      $ref: '#/Money'

Order:
  type: object
  required: [id, account_id, status, tax_treatment, totals, items, documents]
  properties:
    id:
      type: string
      format: uuid
    account_id:
      type: string
      format: uuid
    status:
      type: string
      enum: [pending_payment, under_review, paid, provisioning, completed, cancelled, failed]
    tax_treatment:
      type: string
      enum: [gr_standard, eu_reverse, non_eu]
    vies_fallback_applied:
      type: boolean
      description: v1.3 — Greek VAT charged because VIES was unavailable/unconfirmed.
    coupon:
      type: ['object', 'null']
      properties:
        code:
          type: string
        discount:
          $ref: '#/Money'
    totals:
      $ref: '#/Totals'
    items:
      type: array
      items:
        type: object
        required: [id, kind, name, cycle, totals]
        properties:
          id:
            type: string
            format: uuid
          kind:
            type: string
            enum: [plan, addon]
          name:
            type: string
          cycle:
            type: string
            enum: [monthly, annually]
          domain:
            type: [string, 'null']
          vat_rate:
            type: string
            examples: ['24.00']
          totals:
            $ref: '#/Totals'
    documents:
      type: array
      items:
        $ref: '#/DocumentRef'
    created_at:
      type: string
      format: date-time

Problem:
  type: object
  description: RFC 9457 problem details with a stable machine-readable `code`.
  required: [type, title, status, code, instance]
  properties:
    type:
      type: string
      format: uri
      examples: ['https://api.bithosting.cloud/problems/not-found']
    title:
      type: string
      description: Localized (el default, en via Accept-Language).
    status:
      type: integer
    code:
      type: string
      description: Stable UPPER_SNAKE error code.
      examples: [NOT_FOUND]
    instance:
      type: string
    detail:
      type: string
  additionalProperties: true

ValidationProblem:
  allOf:
    - $ref: '#/Problem'
    - type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

User:
  type: object
  required: [id, name, email, locale, totp_enabled]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    email:
      type: string
      format: email
    locale:
      type: string
      enum: [el, en]
    totp_enabled:
      type: boolean
    last_login_at:
      type: [string, 'null']
      format: date-time
    created_at:
      type: string
      format: date-time

Money:
  type: object
  description: Spec §3.3 — integer minor units, EUR only in v1.
  required: [amount, currency]
  properties:
    amount:
      type: integer
      description: Cents.
    currency:
      type: string
      const: EUR

Account:
  type: object
  required: [id, name, type, balance]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    type:
      type: string
      enum: [individual, company]
    address_line1:
      type: [string, 'null']
    address_line2:
      type: [string, 'null']
    city:
      type: [string, 'null']
    postal_code:
      type: [string, 'null']
    country:
      type: [string, 'null']
      description: ISO 3166-1 alpha-2.
    vat_number:
      type: [string, 'null']
    vies_valid:
      type: [boolean, 'null']
    vies_checked_at:
      type: [string, 'null']
      format: date-time
    tax_treatment:
      type: [string, 'null']
      enum: [gr_standard, eu_reverse, non_eu, null]
    balance:
      $ref: '#/Money'
    created_at:
      type: string
      format: date-time

AccountMember:
  type: object
  required: [id, role, user]
  properties:
    id:
      type: string
      format: uuid
    role:
      type: string
      enum: [owner, admin, billing, tech]
    accepted_at:
      type: [string, 'null']
      format: date-time
    user:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email

AccountInvite:
  type: object
  required: [id, role, email]
  properties:
    id:
      type: string
      format: uuid
    role:
      type: string
      enum: [admin, billing, tech]
    email:
      type: string
      format: email
    invited_by:
      type: [string, 'null']
      format: uuid
    created_at:
      type: string
      format: date-time

AdminUser:
  type: object
  required: [id, name, email, totp_enabled]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    email:
      type: string
      format: email
    role:
      type: [string, 'null']
      description: Role key (e.g. super_admin).
    totp_enabled:
      type: boolean
    last_login_at:
      type: [string, 'null']
      format: date-time
    created_at:
      type: string
      format: date-time

TotpSetup:
  type: object
  required: [secret, otpauth_uri]
  properties:
    secret:
      type: string
      description: Base32 TOTP secret (shown once; SPA renders the QR).
    otpauth_uri:
      type: string
      format: uri

LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
    remember:
      type: boolean
      description: Ignored on the admin surface (admins get no remember-me).

TotpCodeRequest:
  type: object
  required: [code]
  properties:
    code:
      type: string
      minLength: 6
      maxLength: 21
      description: >
        6-digit TOTP code — or, on the login challenge, a one-time recovery
        code (v1.3). Recovery codes are consumed on use.

RecoveryCodes:
  type: object
  required: [recovery_codes]
  properties:
    recovery_codes:
      type: array
      minItems: 8
      maxItems: 8
      description: One-time codes, shown exactly once — store them safely.
      items:
        type: string

ServerCapacity:
  type: object
  description: Allocator inputs (spec §6.1). Headroom = allocatable_gb × oversub_ratio.
  required: [max_accounts, allocatable_gb, oversub_ratio]
  properties:
    max_accounts:
      type: integer
      minimum: 1
    allocatable_gb:
      type: integer
      minimum: 1
    oversub_ratio:
      type: number
      minimum: 1

AdminServer:
  type: object
  description: plesk_api_key is write-only and never appears here.
  required: [id, name, role, provisioner, hostname, wg_ip, public_ips, capacity, status, health]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    role:
      type: string
      enum: [shared, wp, vps_region_ref, erp]
    provisioner:
      type: string
      enum: [plesk, hetzner_cloud, manual]
    hostname:
      type: string
    wg_ip:
      type: string
    public_ips:
      type: array
      items:
        type: string
    capacity:
      $ref: '#/ServerCapacity'
    monthly_license_cents:
      type: [integer, 'null']
    monthly_hw_cents:
      type: [integer, 'null']
    status:
      type: string
      enum: [active, draining, maintenance, offline]
    health:
      type: object
      description: Last healthcheck snapshot (reachable, disk_pct, load, checked_at).
      additionalProperties: true
    services_count:
      type: integer
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

AdminServerWrite:
  type: object
  required: [name, role, provisioner, hostname, wg_ip, capacity]
  properties:
    name:
      type: string
    role:
      type: string
      enum: [shared, wp, vps_region_ref, erp]
    provisioner:
      type: string
      enum: [plesk, hetzner_cloud, manual]
    hostname:
      type: string
    wg_ip:
      type: string
    public_ips:
      type: array
      items:
        type: string
    plesk_api_key:
      type: string
      writeOnly: true
      description: Stored encrypted; omit on update to keep the current key.
    capacity:
      $ref: '#/ServerCapacity'
    monthly_license_cents:
      type: [integer, 'null']
    monthly_hw_cents:
      type: [integer, 'null']
    status:
      type: string
      enum: [active, draining, maintenance, offline]

ServerIp:
  type: object
  required: [id, ip, kind]
  properties:
    id:
      type: string
      format: uuid
    ip:
      type: string
    kind:
      type: string
      enum: [shared, dedicated]
    assigned_service_id:
      type: [string, 'null']
      format: uuid

ServerIpWrite:
  type: object
  required: [ip, kind]
  properties:
    ip:
      type: string
    kind:
      type: string
      enum: [shared, dedicated]

PlanMap:
  type: object
  required: [id, plan_key, plesk_plan_id, plesk_plan_name, synced_at]
  properties:
    id:
      type: string
      format: uuid
    plan_key:
      type: string
    plesk_plan_id:
      type: string
    plesk_plan_name:
      type: string
    synced_at:
      type: string
      format: date-time

PlanMapSyncResult:
  type: object
  required: [mapped, missing]
  properties:
    mapped:
      type: array
      items:
        $ref: '#/PlanMap'
    missing:
      type: array
      description: Active plan keys with no matching service plan on the node.
      items:
        type: string

ProvisionTask:
  type: object
  required: [id, service_id, action, status, attempt, timeline]
  properties:
    id:
      type: string
      format: uuid
    service_id:
      type: string
      format: uuid
    action:
      type: string
      enum: [provision, suspend, unsuspend, terminate, change_plan, import]
    status:
      type: string
      enum: [pending, running, failed, completed]
    attempt:
      type: integer
    last_error:
      type: [string, 'null']
    timeline:
      type: array
      description: Append-only step log (§6.2), broadcast on account.{uuid}.
      items:
        type: object
        required: [step, status, at]
        properties:
          step:
            type: string
          status:
            type: string
            enum: [started, completed, skipped, failed]
          at:
            type: string
            format: date-time
          note:
            type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ReconFinding:
  type: object
  required: [id, server_id, kind, payload, created_at]
  properties:
    id:
      type: string
      format: uuid
    server_id:
      type: string
      format: uuid
    kind:
      type: string
      enum: [orphan_on_node, missing_on_node, quota_drift, usage]
    payload:
      type: object
      additionalProperties: true
    resolved_at:
      type: [string, 'null']
      format: date-time
    created_at:
      type: string
      format: date-time

Service:
  type: object
  description: Customer view — external refs and node internals never leak.
  required: [id, account_id, product_key, plan, status, cycle, price, addons]
  properties:
    id:
      type: string
      format: uuid
    account_id:
      type: string
      format: uuid
    product_key:
      type: string
      enum: [shared, wp, woo, vps, erp]
    plan:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          $ref: '#/I18nName'
    domain:
      type: [string, 'null']
    status:
      type: string
      enum: [pending, provisioning, active, suspended, terminated, failed, cancelled]
    cycle:
      type: string
      enum: [monthly, annually]
    price:
      $ref: '#/Money'
    next_due_at:
      type: [string, 'null']
      format: date-time
    suspended_reason:
      type: [string, 'null']
    addons:
      type: array
      items:
        type: object
        required: [key, name, price]
        properties:
          key:
            type: string
          name:
            $ref: '#/I18nName'
          price:
            $ref: '#/Money'
    timeline:
      type: array
      description: Present on show — latest provisioning task steps.
      items:
        type: object
        additionalProperties: true
    cancel_at_period_end:
      type: boolean
      description: >
        M5-B graceful cancellation flag — mutually exclusive with
        pending_plan_change (scheduling a cancel clears it; money
        mutations answer 409 SERVICE_CANCEL_SCHEDULED while set).
    pending_plan_change:
      description: >
        Scheduled downgrade (M3.5) — applied at renewal, quota-guarded at
        J-7 and at application, cancellable until the J-7 invoice issues.
      anyOf:
        - type: object
          required: [plan_key, name, effective_at, cancellable]
          properties:
            plan_key:
              type: string
            name:
              $ref: '#/I18nName'
            effective_at:
              type: string
              format: date-time
            cancellable:
              type: boolean
        - type: 'null'
    created_at:
      type: string
      format: date-time

PlanChangePreview:
  type: object
  description: >
    The proration engine's deterministic numbers (§7 v1.9 rounding —
    retained floors, credit = snapshot − retained, sums close to the cent).
  required: [direction, cycle_days, remaining_days, credit, charge, net_due_now, effective_at]
  properties:
    direction:
      type: string
      enum: [upgrade, downgrade, sidegrade]
    cycle_days:
      type: integer
    remaining_days:
      type: integer
    credit:
      $ref: '#/Money'
    charge:
      description: Full new-cycle price (immediate paths) or the new renewal price (downgrade).
      $ref: '#/Money'
    net_due_now:
      description: >-
        The card's exact share after the §7 balance-first split: gross minus
        what the wallet (balance + fresh credit) absorbs. 0 for downgrades
        and when the wallet covers everything.
      $ref: '#/Money'
    effective_at:
      type: string
      format: date-time

SsoLink:
  type: object
  required: [url, target, expires_at]
  properties:
    url:
      type: string
      format: uri
    target:
      type: string
      enum: [panel]
    expires_at:
      type: string
      format: date-time

NodeRegisterWrite:
  type: object
  required: [name, role, hostname, wg_ip, plesk_api_key]
  properties:
    name:
      type: string
    role:
      type: string
      enum: [shared, wp]
    hostname:
      type: string
    wg_ip:
      type: string
    public_ips:
      type: array
      items:
        type: string
    plesk_api_key:
      type: string
      writeOnly: true
    capacity:
      $ref: '#/ServerCapacity'

Domain:
  type: object
  description: >
    Customer view of a domain and its managed zone (§8). Zone status
    attention_needed means managed records were skipped over conflicts with
    pre-existing customer records — surfaced here, never silently
    half-applied.
  required: [id, account_id, fqdn, source, zone]
  properties:
    id:
      type: string
      format: uuid
    account_id:
      type: string
      format: uuid
    service_id:
      type: [string, 'null']
      format: uuid
    fqdn:
      type: string
    source:
      type: string
      enum: [byo, registered]
    ns_verified_at:
      type: [string, 'null']
      format: date-time
    zone:
      anyOf:
        - $ref: '#/DnsZone'
        - type: 'null'
    created_at:
      type: string
      format: date-time

DnsZone:
  type: object
  required: [status, ns, proxied_default, conflicts]
  properties:
    status:
      type: string
      description: attention_needed = zone up but managed records skipped over conflicts.
      enum: [pending, active, error, attention_needed]
    ns:
      type: array
      items:
        type: string
    proxied_default:
      type: boolean
    conflicts:
      type: array
      description: >
        Managed records NOT applied because a pre-existing customer record
        occupies the same name/type — never overwritten (§8 guardrail).
      items:
        type: object
        required: [name, type, reason]
        properties:
          name:
            type: string
          type:
            type: string
          reason:
            type: string

DnsRecord:
  type: object
  required: [id, type, name, content, ttl, proxied, managed]
  properties:
    id:
      type: string
      description: Cloudflare record id.
    type:
      type: string
      description: A, AAAA, CNAME, MX, TXT, NS, SRV, CAA…
    name:
      type: string
    content:
      type: string
    ttl:
      type: integer
      description: Seconds; 1 = automatic.
    priority:
      type: [integer, 'null']
      description: MX/SRV only.
    proxied:
      type: boolean
    managed:
      type: boolean
      description: Carries the bhc managed tag — guarded in the editor.
    comment:
      type: [string, 'null']

DnsRecordInput:
  type: object
  required: [type, name, content]
  properties:
    type:
      type: string
    name:
      type: string
    content:
      type: string
    ttl:
      type: integer
      default: 1
    priority:
      type: integer
    proxied:
      type: boolean
      default: false

PropagationStatus:
  type: object
  description: >
    Live DoH probe verdict. `unknown` = the resolver could not answer —
    the probe degrades, it never 5xxs (§3.1 sanctioned-exception terms).
  required: [status, expected_ns, current_ns, checked_at]
  properties:
    status:
      type: string
      enum: [connected, pending, unknown]
    expected_ns:
      type: array
      items:
        type: string
    current_ns:
      type: array
      items:
        type: string
    checked_at:
      type: string
      format: date-time

Notification:
  type: object
  description: >
    In-app notification row (M5-B) — a routed consumer product of the typed
    outbox events (golden rule 12). title/body are resolved for the
    caller's locale; type + payload stay raw for client-side rendering.
  required: [id, category, type, title, body, read_at, created_at]
  properties:
    id:
      type: string
      format: uuid
    category:
      type: string
      enum: [billing, technical, marketing]
    type:
      type: string
      description: The originating outbox event name (e.g. invoice.paid).
    title:
      type: string
    body:
      type: string
    payload:
      type: object
      additionalProperties: true
    read_at:
      type: [string, 'null']
      format: date-time
    created_at:
      type: string
      format: date-time

NotificationPreferences:
  type: object
  description: >
    v1: only the EMAIL channel is toggleable per category — in-app is
    always on (owner decision 2026-08-22); push is a schema slot. Marketing
    consent is explicit and defaults OFF; critical transactional
    notifications ignore these toggles entirely.
  required: [billing, technical, marketing]
  properties:
    billing:
      $ref: '#/ChannelToggles'
    technical:
      $ref: '#/ChannelToggles'
    marketing:
      $ref: '#/ChannelToggles'

ChannelToggles:
  type: object
  required: [email]
  properties:
    email:
      type: boolean

SessionDevice:
  type: object
  description: A revocable login session (§15.1). The session itself is server-side; revoking kills it immediately.
  required: [id, label, ip, last_seen_at, current, created_at]
  properties:
    id:
      type: string
      format: uuid
    label:
      type: string
      description: Parsed from the user agent (browser on platform).
    ip:
      type: string
    ua:
      type: [string, 'null']
    last_seen_at:
      type: string
      format: date-time
    current:
      type: boolean
      description: True for the session making this request.
    created_at:
      type: string
      format: date-time

CustomerInvoice:
  type: object
  description: Customer view of a billing document. Numbers are gapless per series; issued documents are immutable.
  required: [id, number, type, status, issue_date, net, vat, gross]
  properties:
    id:
      type: string
      format: uuid
    number:
      type: string
      description: Display number (e.g. A-000123, PF-000045).
    type:
      type: string
      enum: [proforma, invoice]
    status:
      type: string
      enum: [draft, issued, paid, overdue, void]
    issue_date:
      type: string
      format: date
    due_date:
      type: [string, 'null']
      format: date
    net:
      $ref: '#/Money'
    vat:
      $ref: '#/Money'
    gross:
      $ref: '#/Money'
    tax_treatment:
      type: [string, 'null']
    pdf_available:
      type: boolean
    lines:
      type: array
      description: Present on show.
      items:
        type: object
        additionalProperties: true
    created_at:
      type: string
      format: date-time

PaymentMethod:
  type: object
  description: Saved card handle — the gateway token never leaves the server.
  required: [id, gateway, is_default, created_at]
  properties:
    id:
      type: string
      format: uuid
    gateway:
      type: string
    brand:
      type: [string, 'null']
    last4:
      type: [string, 'null']
    is_default:
      type: boolean
    created_at:
      type: string
      format: date-time

CreditEntry:
  type: object
  description: One credit-ledger movement; delta is signed (credits positive, debits negative).
  required: [id, delta, reason, balance_after, created_at]
  properties:
    id:
      type: string
      format: uuid
    delta:
      $ref: '#/Money'
    reason:
      type: string
    reference:
      type: [string, 'null']
    balance_after:
      $ref: '#/Money'
    created_at:
      type: string
      format: date-time

UsagePoint:
  type: object
  required: [captured_at, disk_mb]
  properties:
    captured_at:
      type: string
      format: date-time
    disk_mb:
      type: integer
    traffic_mb:
      type: [integer, 'null']
    mailboxes:
      type: [integer, 'null']

StatusOverview:
  type: object
  description: >
    The public status picture (M6). Node components are OPT-IN anonymous
    aggregates (servers.status_label per §10 — "Shared EU-1"); nothing
    here ever carries hostnames, IPs, customer domains or fleet sizes.
  required: [components, incidents, maintenance, generated_at]
  properties:
    components:
      type: array
      items:
        $ref: '#/StatusComponent'
    incidents:
      type: array
      description: Open incidents explicitly flagged public — never automatic.
      items:
        $ref: '#/PublicIncident'
    maintenance:
      type: array
      description: Published maintenance windows (upcoming + active).
      items:
        $ref: '#/PublicMaintenance'
    generated_at:
      type: string
      format: date-time

StatusComponent:
  type: object
  required: [label, status]
  properties:
    label:
      type: string
      description: Public label only (platform component or anonymous node aggregate).
    status:
      type: string
      enum: [operational, degraded, down]
    uptime_90d:
      type: [number, 'null']
      description: Percentage over the last 90 days, when history exists.

StatusComponentHistory:
  type: object
  required: [label, days]
  properties:
    label:
      type: string
    days:
      type: array
      items:
        $ref: '#/UptimePoint'

PublicIncident:
  type: object
  description: Public view — component + timeframe + state; internal cause never leaks.
  required: [id, component, status, opened_at]
  properties:
    id:
      type: string
      format: uuid
    component:
      type: string
      description: The public label the incident is pinned to.
    status:
      type: string
      enum: [open, resolved]
    opened_at:
      type: string
      format: date-time
    resolved_at:
      type: [string, 'null']
      format: date-time

PublicMaintenance:
  type: object
  required: [id, title, body, starts_at, ends_at]
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
      description: Localized for the request locale.
    body:
      type: string
    component:
      type: [string, 'null']
    starts_at:
      type: string
      format: date-time
    ends_at:
      type: string
      format: date-time

UptimePoint:
  type: object
  required: [date, uptime_pct]
  properties:
    date:
      type: string
      format: date
    uptime_pct:
      type: number
    checks:
      type: [integer, 'null']
    fails:
      type: [integer, 'null']

ResponseTimePoint:
  type: object
  required: [bucket, avg_ms, p95_ms]
  properties:
    bucket:
      type: string
      format: date-time
    avg_ms:
      type: number
    p95_ms:
      type: number

VpsMetricPoint:
  type: object
  description: Hetzner metrics proxy sample (M7) — cached server-side.
  required: [timestamp]
  properties:
    timestamp:
      type: string
      format: date-time
    cpu_pct:
      type: [number, 'null']
    network_in_bytes:
      type: [number, 'null']
    network_out_bytes:
      type: [number, 'null']

WordpressCard:
  type: object
  description: >
    §11 portal WP card, honest-null (M7/LD-8): every field the live WP
    Toolkit surface has not verified yet is null — never fabricated.
  required: [installed, sso_available]
  properties:
    installed:
      type: boolean
    version:
      type: [string, 'null']
    updates:
      type: ['object', 'null']
      description: Updates summary when the toolkit info verb is verified (LD-8); null until then.
      additionalProperties: true
    sso_available:
      type: boolean

# ── M8: Admin v1 + Hardening (non-live) ──────────────────────────────────────

