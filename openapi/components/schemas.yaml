Problem:
  type: object
  description: RFC 9457 problem details with a stable machine-readable `code`.
  required: [type, title, status, code, instance]
  properties:
    type:
      type: string
      format: uri
      examples: ['https://api.bithosting.cloud/problems/not-found']
    title:
      type: string
      description: Localized (el default, en via Accept-Language).
    status:
      type: integer
    code:
      type: string
      description: Stable UPPER_SNAKE error code.
      examples: [NOT_FOUND]
    instance:
      type: string
    detail:
      type: string
  additionalProperties: true

ValidationProblem:
  allOf:
    - $ref: '#/Problem'
    - type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

User:
  type: object
  required: [id, name, email, locale, totp_enabled]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    email:
      type: string
      format: email
    locale:
      type: string
      enum: [el, en]
    totp_enabled:
      type: boolean
    last_login_at:
      type: [string, 'null']
      format: date-time
    created_at:
      type: string
      format: date-time

Money:
  type: object
  description: Spec §3.3 — integer minor units, EUR only in v1.
  required: [amount, currency]
  properties:
    amount:
      type: integer
      description: Cents.
    currency:
      type: string
      const: EUR

Account:
  type: object
  required: [id, name, type, balance]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    type:
      type: string
      enum: [individual, company]
    address_line1:
      type: [string, 'null']
    address_line2:
      type: [string, 'null']
    city:
      type: [string, 'null']
    postal_code:
      type: [string, 'null']
    country:
      type: [string, 'null']
      description: ISO 3166-1 alpha-2.
    vat_number:
      type: [string, 'null']
    vies_valid:
      type: [boolean, 'null']
    vies_checked_at:
      type: [string, 'null']
      format: date-time
    tax_treatment:
      type: [string, 'null']
      enum: [gr_standard, eu_reverse, non_eu, null]
    balance:
      $ref: '#/Money'
    created_at:
      type: string
      format: date-time

AdminUser:
  type: object
  required: [id, name, email, totp_enabled]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    email:
      type: string
      format: email
    role:
      type: [string, 'null']
      description: Role key (e.g. super_admin).
    totp_enabled:
      type: boolean
    last_login_at:
      type: [string, 'null']
      format: date-time
    created_at:
      type: string
      format: date-time

TotpSetup:
  type: object
  required: [secret, otpauth_uri]
  properties:
    secret:
      type: string
      description: Base32 TOTP secret (shown once; SPA renders the QR).
    otpauth_uri:
      type: string
      format: uri

LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
    remember:
      type: boolean
      description: Ignored on the admin surface (admins get no remember-me).

TotpCodeRequest:
  type: object
  required: [code]
  properties:
    code:
      type: string
      pattern: '^[0-9]{6}$'
