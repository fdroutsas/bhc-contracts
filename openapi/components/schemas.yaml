      format: uuid
    account_id:
      type: string
      format: uuid
    service_id:
      type: [string, 'null']
      format: uuid
    kind:
      type: string
      enum: [migration, domain_registration]
    status:
      type: string
      enum: [new, in_progress, waiting_customer, done]
    assignee:
      type: [string, 'null']
      format: uuid
    notes:
      type: [string, 'null']
    timeline:
