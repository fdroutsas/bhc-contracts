I18nName:
  type: object
  description: Per-locale strings (spec §18).
  required: [el, en]
  properties:
    el:
      type: string
    en:
      type: string

PriceWrite:
  type: object
  required: [cycle, price_cents]
  properties:
    cycle:
      type: string
      enum: [monthly, annually]
    price_cents:
      type: integer
      minimum: 0
    setup_cents:
      type: integer
      minimum: 0
      default: 0
    compare_at_cents:
      type: [integer, 'null']
      minimum: 0

AdminProduct:
  type: object
  required: [id, key, name, provisioner, active]
  properties:
    id:
      type: string
      format: uuid
    key:
      type: string
      enum: [shared, wp, woo, vps, erp]
    name:
      $ref: '#/I18nName'
    provisioner:
      type: string
      enum: [plesk, hetzner_cloud, manual]
    active:
      type: boolean
    plans:
      type: array
      items:
        $ref: '#/AdminPlan'

AdminPlan:
  type: object
  required: [id, product_id, key, name, sort, config, active, prices]
  properties:
    id:
      type: string
      format: uuid
    product_id:
      type: string
      format: uuid
    key:
      type: string
    name:
      $ref: '#/I18nName'
    sort:
      type: integer
    config:
      type: object
      additionalProperties: true
    active:
      type: boolean
    prices:
      type: array
      items:
        type: object
        required: [cycle, price_cents, setup_cents]
        properties:
          cycle:
            type: string
            enum: [monthly, annually]
          price_cents:
            type: integer
          setup_cents:
            type: integer
          compare_at_cents:
            type: [integer, 'null']

AdminPlanWrite:
  type: object
  required: [product_id, key, name, prices]
  properties:
    product_id:
      type: string
      format: uuid
    key:
      type: string
    name:
      $ref: '#/I18nName'
    sort:
      type: integer
      default: 0
    config:
      type: object
      additionalProperties: true
    active:
      type: boolean
      default: true
    prices:
      type: array
      minItems: 1
      items:
        $ref: '#/PriceWrite'

AdminAddon:
  type: object
  required: [id, key, name, config, compatible_products, prices]
  properties:
    id:
      type: string
      format: uuid
    key:
      type: string
    name:
      $ref: '#/I18nName'
    config:
      type: object
      additionalProperties: true
    compatible_products:
      type: array
      items:
        type: string
        enum: [shared, wp, woo, vps, erp]
    prices:
      type: array
      items:
        type: object
        required: [cycle, price_cents]
        properties:
          cycle:
            type: string
            enum: [monthly, annually]
          price_cents:
            type: integer

AdminAddonWrite:
  type: object
  required: [key, name, prices]
  properties:
    key:
      type: string
    name:
      $ref: '#/I18nName'
    config:
      type: object
      additionalProperties: true
    compatible_products:
      type: array
      items:
        type: string
        enum: [shared, wp, woo, vps, erp]
    prices:
      type: array
      minItems: 1
      items:
        type: object
        required: [cycle, price_cents]
        properties:
          cycle:
            type: string
            enum: [monthly, annually]
          price_cents:
            type: integer
            minimum: 0

AdminCoupon:
  type: object
  required: [id, code, type, value, active]
  properties:
    id:
      type: string
      format: uuid
    code:
      type: string
    type:
      type: string
      enum: [percent, fixed]
    value:
      type: integer
      description: Percent 1–100, or cents for fixed.
    applies_to:
      type: object
      additionalProperties: true
    max_redemptions:
      type: [integer, 'null']
    per_account_limit:
      type: [integer, 'null']
    valid_from:
      type: [string, 'null']
      format: date-time
    valid_until:
      type: [string, 'null']
      format: date-time
    active:
      type: boolean
    created_at:
      type: string
      format: date-time

AdminCouponWrite:
  type: object
  required: [code, type, value]
  properties:
    code:
      type: string
      maxLength: 40
    type:
      type: string
      enum: [percent, fixed]
    value:
      type: integer
      minimum: 1
    applies_to:
      type: object
      additionalProperties: true
    max_redemptions:
      type: [integer, 'null']
      minimum: 1
    per_account_limit:
      type: [integer, 'null']
      minimum: 1
    valid_from:
      type: [string, 'null']
      format: date-time
    valid_until:
      type: [string, 'null']
      format: date-time
    active:
      type: boolean
      default: true

DocumentRef:
  type: object
  description: Lightweight reference to a billing document (proforma/invoice).
  required: [id, series, number, display_number, type, status, totals]
  properties:
    id:
      type: string
      format: uuid
    series:
      type: string
    number:
      type: integer
    display_number:
      type: string
      examples: [PF-000001]
    type:
      type: string
      enum: [invoice, proforma]
    status:
      type: string
      enum: [draft, issued, paid, overdue, void]
    issue_date:
      type: [string, 'null']
      format: date
    due_date:
      type: [string, 'null']
      format: date
    mydata_mark:
      type: [string, 'null']
    pdf_available:
      type: boolean
    totals:
      $ref: '#/Totals'

Totals:
  type: object
  required: [net, vat, gross]
  properties:
    net:
      $ref: '#/Money'
    vat:
      $ref: '#/Money'
    gross:
      $ref: '#/Money'

Order:
  type: object
  required: [id, account_id, status, tax_treatment, totals, items, documents]
  properties:
    id:
      type: string
      format: uuid
    account_id:
      type: string
      format: uuid
    status:
      type: string
      enum: [pending_payment, under_review, paid, provisioning, completed, cancelled, failed]
    tax_treatment:
      type: string
      enum: [gr_standard, eu_reverse, non_eu]
    vies_fallback_applied:
      type: boolean
      description: v1.3 — Greek VAT charged because VIES was unavailable/unconfirmed.
    coupon:
      type: ['object', 'null']
      properties:
        code:
          type: string
        discount:
          $ref: '#/Money'
    totals:
      $ref: '#/Totals'
    items:
      type: array
      items:
        type: object
        required: [id, kind, name, cycle, totals]
        properties:
          id:
            type: string
            format: uuid
          kind:
            type: string
            enum: [plan, addon]
          name:
            type: string
          cycle:
            type: string
            enum: [monthly, annually]
          domain:
            type: [string, 'null']
          vat_rate:
            type: string
            examples: ['24.00']
          totals:
            $ref: '#/Totals'
    documents:
      type: array
      items:
        $ref: '#/DocumentRef'
    created_at:
      type: string
      format: date-time

Problem:
  type: object
  description: RFC 9457 problem details with a stable machine-readable `code`.
  required: [type, title, status, code, instance]
  properties:
    type:
      type: string
      format: uri
      examples: ['https://api.bithosting.cloud/problems/not-found']
    title:
      type: string
      description: Localized (el default, en via Accept-Language).
    status:
      type: integer
    code:
      type: string
      description: Stable UPPER_SNAKE error code.
      examples: [NOT_FOUND]
    instance:
      type: string
    detail:
      type: string
  additionalProperties: true

ValidationProblem:
  allOf:
    - $ref: '#/Problem'
    - type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

User:
  type: object
  required: [id, name, email, locale, totp_enabled]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    email:
      type: string
      format: email
    locale:
      type: string
      enum: [el, en]
    totp_enabled:
      type: boolean
    last_login_at:
      type: [string, 'null']
      format: date-time
    created_at:
      type: string
      format: date-time

Money:
  type: object
  description: Spec §3.3 — integer minor units, EUR only in v1.
  required: [amount, currency]
  properties:
    amount:
      type: integer
      description: Cents.
    currency:
      type: string
      const: EUR

Account:
  type: object
  required: [id, name, type, balance]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    type:
      type: string
      enum: [individual, company]
    address_line1:
      type: [string, 'null']
    address_line2:
      type: [string, 'null']
    city:
      type: [string, 'null']
    postal_code:
      type: [string, 'null']
    country:
      type: [string, 'null']
      description: ISO 3166-1 alpha-2.
    vat_number:
      type: [string, 'null']
    vies_valid:
      type: [boolean, 'null']
    vies_checked_at:
      type: [string, 'null']
      format: date-time
    tax_treatment:
      type: [string, 'null']
      enum: [gr_standard, eu_reverse, non_eu, null]
    balance:
      $ref: '#/Money'
    created_at:
      type: string
      format: date-time

AccountMember:
  type: object
  required: [id, role, user]
  properties:
    id:
      type: string
      format: uuid
    role:
      type: string
      enum: [owner, admin, billing, tech]
    accepted_at:
      type: [string, 'null']
      format: date-time
    user:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email

AccountInvite:
  type: object
  required: [id, role, email]
  properties:
    id:
      type: string
      format: uuid
    role:
      type: string
      enum: [admin, billing, tech]
    email:
      type: string
      format: email
    invited_by:
      type: [string, 'null']
      format: uuid
    created_at:
      type: string
      format: date-time

AdminUser:
  type: object
  required: [id, name, email, totp_enabled]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    email:
      type: string
      format: email
    role:
      type: [string, 'null']
      description: Role key (e.g. super_admin).
    totp_enabled:
      type: boolean
    last_login_at:
      type: [string, 'null']
      format: date-time
    created_at:
      type: string
      format: date-time

TotpSetup:
  type: object
  required: [secret, otpauth_uri]
  properties:
    secret:
      type: string
      description: Base32 TOTP secret (shown once; SPA renders the QR).
    otpauth_uri:
      type: string
      format: uri

LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
    remember:
      type: boolean
      description: Ignored on the admin surface (admins get no remember-me).

TotpCodeRequest:
  type: object
  required: [code]
  properties:
    code:
      type: string
      minLength: 6
      maxLength: 21
      description: >
        6-digit TOTP code — or, on the login challenge, a one-time recovery
        code (v1.3). Recovery codes are consumed on use.

RecoveryCodes:
  type: object
  required: [recovery_codes]
  properties:
    recovery_codes:
      type: array
      minItems: 8
      maxItems: 8
      description: One-time codes, shown exactly once — store them safely.
      items:
        type: string

ServerCapacity:
  type: object
  description: Allocator inputs (spec §6.1). Headroom = allocatable_gb × oversub_ratio.
  required: [max_accounts, allocatable_gb, oversub_ratio]
  properties:
    max_accounts:
      type: integer
      minimum: 1
    allocatable_gb:
      type: integer
      minimum: 1
    oversub_ratio:
      type: number
      minimum: 1

AdminServer:
  type: object
  description: plesk_api_key is write-only and never appears here.
  required: [id, name, role, provisioner, hostname, wg_ip, public_ips, capacity, status, health]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    role:
      type: string
      enum: [shared, wp, vps_region_ref, erp]
    provisioner:
      type: string
      enum: [plesk, hetzner_cloud, manual]
    hostname:
      type: string
    wg_ip:
      type: string
    public_ips:
      type: array
      items:
        type: string
    capacity:
      $ref: '#/ServerCapacity'
    monthly_license_cents:
      type: [integer, 'null']
    monthly_hw_cents:
      type: [integer, 'null']
    status:
      type: string
      enum: [active, draining, maintenance, offline]
    health:
      type: object
      description: Last healthcheck snapshot (reachable, disk_pct, load, checked_at).
      additionalProperties: true
    services_count:
      type: integer
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

AdminServerWrite:
  type: object
  required: [name, role, provisioner, hostname, wg_ip, capacity]
  properties:
    name:
      type: string
    role:
      type: string
      enum: [shared, wp, vps_region_ref, erp]
    provisioner:
      type: string
      enum: [plesk, hetzner_cloud, manual]
    hostname:
      type: string
    wg_ip:
      type: string
    public_ips:
      type: array
      items:
        type: string
    plesk_api_key:
      type: string
      writeOnly: true
      description: Stored encrypted; omit on update to keep the current key.
    capacity:
      $ref: '#/ServerCapacity'
    monthly_license_cents:
      type: [integer, 'null']
    monthly_hw_cents:
      type: [integer, 'null']
    status:
      type: string
      enum: [active, draining, maintenance, offline]

ServerIp:
  type: object
  required: [id, ip, kind]
  properties:
    id:
      type: string
      format: uuid
    ip:
      type: string
    kind:
      type: string
      enum: [shared, dedicated]
    assigned_service_id:
      type: [string, 'null']
      format: uuid

ServerIpWrite:
  type: object
  required: [ip, kind]
  properties:
    ip:
      type: string
    kind:
      type: string
      enum: [shared, dedicated]

PlanMap:
  type: object
  required: [id, plan_key, plesk_plan_id, plesk_plan_name, synced_at]
  properties:
    id:
      type: string
      format: uuid
    plan_key:
      type: string
    plesk_plan_id:
      type: string
    plesk_plan_name:
      type: string
    synced_at:
      type: string
      format: date-time

PlanMapSyncResult:
  type: object
  required: [mapped, missing]
  properties:
    mapped:
      type: array
      items:
        $ref: '#/PlanMap'
    missing:
      type: array
      description: Active plan keys with no matching service plan on the node.
      items:
        type: string

ProvisionTask:
  type: object
  required: [id, service_id, action, status, attempt, timeline]
  properties:
    id:
      type: string
      format: uuid
    service_id:
      type: string
      format: uuid
    action:
      type: string
      enum: [provision, suspend, unsuspend, terminate, change_plan, import]
    status:
      type: string
      enum: [pending, running, failed, completed]
    attempt:
      type: integer
    last_error:
      type: [string, 'null']
    timeline:
      type: array
      description: Append-only step log (§6.2), broadcast on account.{uuid}.
      items:
        type: object
        required: [step, status, at]
        properties:
          step:
            type: string
          status:
            type: string
            enum: [started, completed, skipped, failed]
          at:
            type: string
            format: date-time
          note:
            type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ReconFinding:
  type: object
  required: [id, server_id, kind, payload, created_at]
  properties:
    id:
      type: string
      format: uuid
    server_id:
      type: string
      format: uuid
    kind:
      type: string
      enum: [orphan_on_node, missing_on_node, quota_drift, usage]
    payload:
      type: object
      additionalProperties: true
    resolved_at:
      type: [string, 'null']
      format: date-time
    created_at:
      type: string
      format: date-time

Service:
  type: object
  description: Customer view — external refs and node internals never leak.
  required: [id, account_id, product_key, plan, status, cycle, price, addons]
  properties:
    id:
      type: string
      format: uuid
    account_id:
      type: string
      format: uuid
    product_key:
      type: string
      enum: [shared, wp, woo, vps, erp]
    plan:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          $ref: '#/I18nName'
    domain:
      type: [string, 'null']
    status:
      type: string
      enum: [pending, provisioning, active, suspended, terminated, failed, cancelled]
    cycle:
      type: string
      enum: [monthly, annually]
    price:
      $ref: '#/Money'
    next_due_at:
      type: [string, 'null']
      format: date-time
    suspended_reason:
      type: [string, 'null']
    addons:
      type: array
      items:
        type: object
        required: [key, name, price]
        properties:
          key:
            type: string
          name:
            $ref: '#/I18nName'
          price:
            $ref: '#/Money'
    timeline:
      type: array
      description: Present on show — latest provisioning task steps.
      items:
        type: object
        additionalProperties: true
    created_at:
      type: string
      format: date-time

SsoLink:
  type: object
  required: [url, target, expires_at]
  properties:
    url:
      type: string
      format: uri
    target:
      type: string
      enum: [panel]
    expires_at:
      type: string
      format: date-time

NodeRegisterWrite:
  type: object
  required: [name, role, hostname, wg_ip, plesk_api_key]
  properties:
    name:
      type: string
    role:
      type: string
      enum: [shared, wp]
    hostname:
      type: string
    wg_ip:
      type: string
    public_ips:
      type: array
      items:
        type: string
    plesk_api_key:
      type: string
      writeOnly: true
    capacity:
      $ref: '#/ServerCapacity'
